version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gosf
    main: .
    binary: gosf
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/BU-Neuromics/gosf/cmd.version={{.Version}}

archives:
  - id: gosf
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: BU-Neuromics
    name: gosf

changelog:
  disable: true # release notes are sourced from CHANGELOG.md by the workflow
